name: Abgeschlossene Branches bereinigen

on:
  push:
    branches: [main]
    paths: ['.github/workflows/cleanup-branches.yml']

permissions:
  contents: read

jobs:
  cleanup:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Vollständig integrierte Branches entfernen
        uses: actions/github-script@v7
        with:
          script: |
            const { execFileSync } = require('node:child_process');
            const branches = [
              'feature/2-ci-cd',
              'feature/7-abgabenachweise',
              'feature/12-raster-team-abschluss',
              'feature/17-aleksandar-abnahme'
            ];
            const checked = [];
            for (const branch of branches) {
              let ref;
              try {
                ({ data: ref } = await github.rest.git.getRef({
                  ...context.repo, ref: 'heads/' + branch
                }));
              } catch (error) {
                if (error.status === 404) {
                  core.info(branch + ': bereits entfernt');
                  continue;
                }
                throw error;
              }
              execFileSync('git', ['merge-base', '--is-ancestor', ref.object.sha, 'HEAD']);
              checked.push({ branch, sha: ref.object.sha });
            }
            for (const { branch, sha } of checked) {
              const { data: current } = await github.rest.git.getRef({
                ...context.repo, ref: 'heads/' + branch
              });
              if (current.object.sha !== sha) {
                throw new Error(branch + ': Branch hat sich während der Prüfung geändert');
              }
              await github.rest.git.deleteRef({ ...context.repo, ref: 'heads/' + branch });
              core.info(branch + ': vollständig integriert und entfernt (' + sha + ')');
            }
