name: Azure Auslieferung main

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: azure-production
  cancel-in-progress: false

jobs:
  deploy:
    if: vars.AZURE_WEBAPP_NAME != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - name: Release vor Auslieferung prüfen
        run: python -m pytest
      - name: Laufzeit-Artefakt ohne Geheimnisse erstellen
        run: python scripts/package_release.py
      - name: Artefakt mit Commit aufbewahren
        uses: actions/upload-artifact@v4
        with:
          name: tagebbbuch-${{ github.sha }}
          path: dist/deploy.zip
          retention-days: 14
      - name: Azure über OpenID Connect anmelden
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Artefakt ausliefern
        id: deployment
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          package: dist/deploy.zip
      - name: Ausgelieferte Version über HTTP prüfen
        env:
          APP_URL: ${{ steps.deployment.outputs.webapp-url }}
          EXPECTED_SHA: ${{ github.sha }}
        run: python scripts/smoke_deployment.py
