name: Tests auf dev

on:
  pull_request:
    branches: [dev]

permissions:
  contents: read

jobs:
  test:
    name: pytest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Testabhängigkeiten installieren
        run: python -m pip install -r requirements-dev.txt
      - name: Tests ausführen
        run: python -m pytest
