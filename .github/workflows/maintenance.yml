name: Projektstruktur aktualisieren

on:
  push:
    branches: [main]
    paths: ['.github/workflows/maintenance.yml']

permissions:
  contents: read

jobs:
  maintenance:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/github-script@v7
        with:
          script: |
            const { execFileSync } = require('node:child_process');
            const branch = 'feature/22-dokumentation';
            let ref;
            try {
              ({ data: ref } = await github.rest.git.getRef({
                ...context.repo, ref: 'heads/' + branch
              }));
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            if (ref) {
              execFileSync('git', ['merge-base', '--is-ancestor', ref.object.sha, 'HEAD']);
              const { data: current } = await github.rest.git.getRef({
                ...context.repo, ref: 'heads/' + branch
              });
              if (current.object.sha !== ref.object.sha) throw new Error('Branch wurde geändert');
              await github.rest.git.deleteRef({ ...context.repo, ref: 'heads/' + branch });
              core.info('Vollständig integrierter Dokumentationsbranch entfernt.');
            }
            const path = '.github/workflows/maintenance.yml';
            const { data: original } = await github.rest.repos.getContent({
              ...context.repo, path, ref: context.sha
            });
            const { data: currentFile } = await github.rest.repos.getContent({
              ...context.repo, path, ref: 'main'
            });
            if (original.sha !== currentFile.sha) throw new Error('Workflow wurde geändert');
            await github.rest.repos.deleteFile({
              ...context.repo, path, sha: original.sha, branch: 'main',
              message: 'chore: Projektstruktur aktualisieren'
            });
