minimum_pre_commit_version: '3.2.0'
default_install_hook_types: [pre-commit, pre-push]
repos:
  - repo: local
    hooks:
      - id: black
        name: Python bei jedem Commit automatisch formatieren
        entry: python -m black
        language: system
        types: [python]
        stages: [pre-commit]
      - id: pytest
        name: Alle Tests bei jedem Push ausführen
        entry: python -m pytest
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
